<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FarmVoice Admin Notifications</title>
  <style>
    :root { color-scheme: light; --ink: #173b2d; --muted: #61766b; --green: #2d6a4f; --line: #dbe5dc; --paper: #fff; --wash: #f3f7f1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% 0%, #e6f0df, transparent 38%), var(--wash); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100% - 32px, 700px); margin: 0 auto; padding: 64px 0; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(23, 59, 45, .1); padding: 38px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 8px 0 10px; font-size: clamp(28px, 5vw, 42px); line-height: 1.1; }
    .intro { color: var(--muted); margin: 0 0 28px; }
    form { display: grid; gap: 17px; }
    label { display: grid; gap: 7px; color: var(--ink); font-size: 14px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; background: #fbfdf9; color: var(--ink); font: inherit; padding: 11px 12px; }
    textarea { min-height: 100px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 3px solid #cfe8d3; border-color: var(--green); }
    button { border: 0; border-radius: 7px; background: var(--green); color: white; cursor: pointer; font: inherit; font-weight: 800; padding: 12px 16px; }
    button:disabled { cursor: wait; opacity: .6; }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .signout { background: transparent; border: 1px solid var(--line); color: var(--ink); font-size: 14px; padding: 8px 11px; }
    .notice { border-radius: 7px; margin: 20px 0 0; padding: 11px 13px; font-weight: 700; }
    .success { background: #e6f5e8; color: #1b653d; }
    .error { background: #fde9e5; color: #9b2e22; }
    .hidden { display: none; }
    .audience-meta { color: var(--muted); font-size: 13px; font-weight: 400; }
    @media (max-width: 560px) { main { padding: 20px 0; } .panel { padding: 24px 20px; } .topline { display: block; } .signout { margin-top: 12px; } }
  </style>
</head>
<body>
  <main>
    <section class="panel">
      <p class="eyebrow">FarmVoice operations</p>
      <div id="loginView">
        <h1>Admin sign in</h1>
        <p class="intro">Sign in to send messages to FarmVoice farmers.</p>
        <form id="loginForm">
          <label>Username <input id="username" autocomplete="username" required></label>
          <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
          <button id="loginButton">Sign in</button>
        </form>
      </div>
      <div id="sendView" class="hidden">
        <div class="topline">
          <div><h1>Send a notification</h1><p class="intro">Choose a farmer from the database or broadcast to all registered devices.</p></div>
          <button class="signout" id="signoutButton" type="button">Sign out</button>
        </div>
        <form id="sendForm">
          <label>Type
            <select id="type"><option value="general">General</option><option value="weather">Weather</option><option value="price">Market price</option><option value="farming">Farming update</option><option value="daily">Daily briefing</option></select>
          </label>
          <label>Title <input id="title" maxlength="120" required></label>
          <label>Message <textarea id="body" maxlength="1000" required></textarea></label>
          <label>Send to
            <select id="audience"><option value="">All registered devices</option></select>
            <span class="audience-meta" id="audienceStatus">Loading farmers...</span>
          </label>
          <button id="sendButton">Send notification</button>
        </form>
      </div>
      <div id="notice" class="notice hidden" role="status"></div>
    </section>
  </main>
  <script>
    const sessionKey = 'farmvoice_admin_session';
    const $ = (id) => document.getElementById(id);
    const loginView = $('loginView');
    const sendView = $('sendView');
    const notice = $('notice');

    function showNotice(message, ok) {
      notice.textContent = message;
      notice.className = `notice ${ok ? 'success' : 'error'}`;
    }

    function showSendView() {
      loginView.classList.add('hidden');
      sendView.classList.remove('hidden');
      loadAudience();
    }

    async function loadAudience() {
      const select = $('audience');
      try {
        const response = await fetch('/api/admin/notifications/audience', { headers: { Authorization: `Bearer ${sessionStorage.getItem(sessionKey)}` } });
        const result = await response.json();
        if (response.status === 401) { showLoginView(); throw new Error('Your session expired. Please sign in again.'); }
        if (!response.ok) throw new Error(result.error?.message || 'Farmers could not be loaded');
        for (const farmer of result.farmers || []) {
          const option = document.createElement('option');
          option.value = farmer.id;
          option.textContent = `${farmer.name} — ${farmer.phone || 'no phone'} (${farmer.deviceCount} device${farmer.deviceCount === 1 ? '' : 's'})`;
          option.disabled = farmer.deviceCount === 0;
          select.appendChild(option);
        }
        $('audienceStatus').textContent = `${result.farmers?.length || 0} farmers loaded from the database.`;
      } catch (error) { $('audienceStatus').textContent = error.message; }
    }

    function showLoginView() {
      sessionStorage.removeItem(sessionKey);
      sendView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('loginButton').disabled = true;
      notice.className = 'notice hidden';
      try {
        const response = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('username').value, password: $('password').value }) });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error?.message || 'Login failed');
        sessionStorage.setItem(sessionKey, result.token);
        $('password').value = '';
        showSendView();
      } catch (error) { showNotice(error.message, false); }
      finally { $('loginButton').disabled = false; }
    });

    $('sendForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('sendButton').disabled = true;
      notice.className = 'notice hidden';
      const selectedProfileId = $('audience').value;
      try {
        const response = await fetch('/api/admin/notifications/send', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${sessionStorage.getItem(sessionKey)}` }, body: JSON.stringify({ title: $('title').value, body: $('body').value, type: $('type').value, ...(selectedProfileId ? { profileIds: [selectedProfileId] } : {}) }) });
        const result = await response.json();
        if (response.status === 401) { showLoginView(); throw new Error('Your session expired. Please sign in again.'); }
        if (!response.ok) throw new Error(result.error?.message || 'Send failed');
        showNotice(`Created ${result.created} notification(s); sent to ${result.sent} device(s).`, true);
        $('title').value = '';
        $('body').value = '';
      } catch (error) { showNotice(error.message, false); }
      finally { $('sendButton').disabled = false; }
    });

    $('signoutButton').addEventListener('click', showLoginView);
    if (sessionStorage.getItem(sessionKey)) showSendView();
  </script>
</body>
</html>
